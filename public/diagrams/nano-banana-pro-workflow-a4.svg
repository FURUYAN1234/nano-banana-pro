<g filter="url(#shadow)"><rect x="70" y="194" width="654" height="63" rx="18" fill="#ffffff" stroke="#2475b9" stroke-width="2.5"/><rect x="70" y="194" width="56" height="63" rx="18" fill="#2475b9"/><rect x="108" y="194" width="18" height="63" fill="#2475b9"/></g><circle cx="98" cy="222" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="228" font-size="15" font-weight="800" fill="#2475b9" text-anchor="middle">0</text><text x="144" y="223" font-size="17" font-weight="800" fill="#172033" text-anchor="start">API接続と検証</text><text x="144" y="247" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">利用するプロバイダーを選択し、接続状態を確認</text><path d="M 397 258 L 397 278" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="279" width="654" height="75" rx="18" fill="#ffffff" stroke="#2475b9" stroke-width="2.5"/><rect x="70" y="279" width="56" height="75" rx="18" fill="#2475b9"/><rect x="108" y="279" width="18" height="75" fill="#2475b9"/></g><circle cx="98" cy="307" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="313" font-size="15" font-weight="800" fill="#2475b9" text-anchor="middle">1</text><text x="144" y="308" font-size="17" font-weight="800" fill="#172033" text-anchor="start">STEP1  素材を解析して土台を作る</text><text x="144" y="332" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">キャラクターシート・任意の背景 / スタイルJSONを読込み、人物・関係・舞台を抽出</text><path d="M 397 355 L 397 375" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="376" width="654" height="95" rx="18" fill="#ffffff" stroke="#2475b9" stroke-width="2.5"/><rect x="70" y="376" width="56" height="95" rx="18" fill="#2475b9"/><rect x="108" y="376" width="18" height="95" fill="#2475b9"/></g><circle cx="98" cy="404" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="410" font-size="15" font-weight="800" fill="#2475b9" text-anchor="middle">2</text><text x="144" y="405" font-size="17" font-weight="800" fill="#172033" text-anchor="start">STEP2  4コマの思考ルーチン</text><text x="144" y="429" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">ニュース検索または自由入力 → 事実を整理 → トーン / オチを決定 → 4コマ台本を生成</text><text x="144" y="447" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">必要なら台本を強化・編集・元に戻す</text><rect x="530" y="397" width="173" height="49" rx="12" fill="#e7f3ff" stroke="#78a8d7"/><text x="616" y="417" font-size="12" font-weight="800" fill="#1f5f9c" text-anchor="middle">フルオート</text><text x="616" y="435" font-size="10.5" font-weight="400" fill="#385779" text-anchor="middle">STEP2 → STEP3 → STEP4</text><path d="M 397 472 L 397 492" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="493" width="654" height="84" rx="18" fill="#ffffff" stroke="#2475b9" stroke-width="2.5"/><rect x="70" y="493" width="56" height="84" rx="18" fill="#2475b9"/><rect x="108" y="493" width="18" height="84" fill="#2475b9"/></g><circle cx="98" cy="521" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="527" font-size="15" font-weight="800" fill="#2475b9" text-anchor="middle">3</text><text x="144" y="522" font-size="17" font-weight="800" fill="#172033" text-anchor="start">STEP3  描写を組み立てる</text><text x="144" y="546" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">カラー / モノクロを選び、人物・台本・画角・セリフを統合して画像プロンプトを作成</text><text x="144" y="564" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">プロンプトは確認・編集・保存できる</text><path d="M 397 578 L 397 598" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="599" width="654" height="83" rx="18" fill="#ffffff" stroke="#8653b8" stroke-width="2.5"/><rect x="70" y="599" width="56" height="83" rx="18" fill="#8653b8"/><rect x="108" y="599" width="18" height="83" fill="#8653b8"/></g><circle cx="98" cy="627" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="633" font-size="15" font-weight="800" fill="#8653b8" text-anchor="middle">4</text><text x="144" y="628" font-size="17" font-weight="800" fill="#172033" text-anchor="start">STEP4  画像を生成する</text><text x="144" y="652" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">参照画像と選択モデルでアプリ内API生成。</text><text x="144" y="670" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">通常エラーは案内して再試行 / Web版へ切替。</text><rect x="497" y="632" width="205" height="34" rx="10" fill="#faf2e9" stroke="#cd8a46"/><text x="599" y="647" font-size="11" font-weight="800" fill="#895824" text-anchor="middle">Web版: アプリ外で生成</text><text x="599" y="661" font-size="10" font-weight="400" fill="#895824" text-anchor="middle">アプリ内QA・履歴の対象外</text><path d="M 397 683 L 397 703" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="704" width="654" height="75" rx="18" fill="#ffffff" stroke="#8653b8" stroke-width="2.5"/><rect x="70" y="704" width="56" height="75" rx="18" fill="#8653b8"/><rect x="108" y="704" width="18" height="75" fill="#8653b8"/></g><circle cx="98" cy="732" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="738" font-size="15" font-weight="800" fill="#8653b8" text-anchor="middle">5</text><text x="144" y="733" font-size="17" font-weight="800" fill="#172033" text-anchor="start">画像QA  出力を検査する</text><text x="144" y="757" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">人物・手・小道具・文字・構図・視線・照明・奥行きを確認し、結果を分岐</text><path d="M 230 780 L 230 800" fill="none" stroke="#bf4c5c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><path d="M 564 780 L 564 800" fill="none" stroke="#bf4c5c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<g filter="url(#shadow)"><rect x="70" y="801" width="310" height="107" rx="18" fill="#fff8f6" stroke="#bf4c5c" stroke-width="2.5"/></g><circle cx="101" cy="831" r="18" fill="#bf4c5c"/><text x="101" y="837" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Q</text><text x="130" y="826" font-size="16" font-weight="800" fill="#7d2635" text-anchor="start">品質課題を検出</text><text x="92" y="852" font-size="12" font-weight="400" fill="#7d5260" text-anchor="start">問題点だけを修正するプロンプトを作成</text><text x="92" y="871" font-size="12" font-weight="400" fill="#7d5260" text-anchor="start">条件付きで再生成 → 再QA</text><path d="M 70 854 H 45 V 742 H 67" fill="none" stroke="#bf4c5c" stroke-width="2.5" marker-end="url(#arrow-red)"/>
<g filter="url(#shadow)"><rect x="414" y="801" width="310" height="107" rx="18" fill="#fff8f6" stroke="#bf4c5c" stroke-width="2.5"/></g><circle cx="445" cy="831" r="18" fill="#bf4c5c"/><text x="445" y="837" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">P</text><text x="474" y="826" font-size="16" font-weight="800" fill="#7d2635" text-anchor="start">コンテンツポリシーエラー</text><text x="436" y="852" font-size="12" font-weight="400" fill="#7d5260" text-anchor="start">テキストAPIで自動修正して再生成</text><text x="436" y="871" font-size="12" font-weight="400" fill="#7d5260" text-anchor="start">最大5回。尽きたら手動対応 / Web版へ</text><path d="M 724 854 H 749 V 641 H 727" fill="none" stroke="#bf4c5c" stroke-width="2.5" marker-end="url(#arrow-red)"/>
<path d="M 397 780 L 397 929" fill="none" stroke="#219679" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/><g filter="url(#shadow)"><rect x="70" y="930" width="654" height="78" rx="18" fill="#ffffff" stroke="#219679" stroke-width="2.5"/><rect x="70" y="930" width="56" height="78" rx="18" fill="#219679"/><rect x="108" y="930" width="18" height="78" fill="#219679"/></g><circle cx="98" cy="958" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="964" font-size="15" font-weight="800" fill="#219679" text-anchor="middle">6</text><text x="144" y="959" font-size="17" font-weight="800" fill="#172033" text-anchor="start">生成履歴と選択</text><text x="144" y="983" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">QAを通過した画像を最大10件保持。比較して候補を選び、次の生成にも活用</text><path d="M 397 1009 L 397 1029" fill="none" stroke="#219679" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
