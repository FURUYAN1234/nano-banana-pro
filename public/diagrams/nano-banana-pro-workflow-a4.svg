<text x="58" y="62" font-size="13" font-weight="800" fill="#c8dcff" text-anchor="start">SUPER FURU AI 4-KOMA SYSTEM</text><text x="58" y="91" font-size="25" font-weight="800" fill="#ffffff" text-anchor="start">全工程フローチャート</text><text x="738" y="63" font-size="13" font-weight="700" fill="#d9d1ff" text-anchor="end">v6.4.1</text><text x="738" y="89" font-size="12" font-weight="400" fill="#ffffff" text-anchor="end">入力 → 思考・設計 → 生成 → 検査 → 保存</text>
