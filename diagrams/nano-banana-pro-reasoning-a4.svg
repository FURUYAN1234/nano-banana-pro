<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title description">
<title id="title">Super FURU AI 4-koma System Reasoning Routine / 思考ルーチン</title><desc id="description">A4 portrait bilingual logic map for source grounding, story planning, constraints, validation, prompt assembly, image QA, and bounded policy retries. / 入力根拠、物語設計、制約、検証、プロンプト構築、画像QA、上限付きポリシー再試行を示すA4縦の英日併記思考ルーチン図。</desc>
<defs><linearGradient id="header" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#173c63"/><stop offset="1" stop-color="#7652a4"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#16223d" flood-opacity=".14"/></filter><marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52617a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4c5c"/></marker><style>text { font-family: Inter, &quot;Noto Sans JP&quot;, &quot;Yu Gothic UI&quot;, sans-serif; }</style></defs>
<rect width="794" height="1123" fill="#f8fafc"/><rect x="28" y="24" width="738" height="92" rx="22" fill="url(#header)"/>
<text x="58" y="62" font-size="13" font-weight="800" fill="#c8dcff" text-anchor="start">SUPER FURU AI 4-KOMA SYSTEM</text><text x="58" y="87" font-size="22" font-weight="800" fill="#ffffff" text-anchor="start">Reasoning Routine / 思考ルーチン</text><text x="738" y="63" font-size="13" font-weight="700" fill="#e6d9ff" text-anchor="end">v6.5.8</text><text x="397" y="105" font-size="9" font-weight="400" fill="#ffffff" text-anchor="middle">Input → Character logic → Story → Constraints → Render → Review / 入力 → キャラ論理 → 台本 → 制約 → 描画 → 検査</text>
<g filter="url(#shadow)"><rect x="70" y="135" width="654" height="83" rx="18" fill="#ffffff" stroke="#2475b9" stroke-width="2.5"/><rect x="70" y="135" width="56" height="83" rx="18" fill="#2475b9"/><rect x="108" y="135" width="18" height="83" fill="#2475b9"/></g><circle cx="98" cy="163" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="169" font-size="15" font-weight="800" fill="#2475b9" text-anchor="middle">1</text><text x="144" y="164" font-size="17" font-weight="800" fill="#172033" text-anchor="start">Analyze &amp; Merge Inputs / 入力を解析・統合</text><text x="144" y="188" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">Sheets → identity, personality, relations, speech/acting tendencies</text><text x="144" y="206" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">Manual edits, Style JSON, 360° scene / 手動修正・作風JSON・360°背景を統合</text><path d="M 397 219 L 397 236" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="237" width="654" height="83" rx="18" fill="#ffffff" stroke="#2475b9" stroke-width="2.5"/><rect x="70" y="237" width="56" height="83" rx="18" fill="#2475b9"/><rect x="108" y="237" width="18" height="83" fill="#2475b9"/></g><circle cx="98" cy="265" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="271" font-size="15" font-weight="800" fill="#2475b9" text-anchor="middle">2</text><text x="144" y="266" font-size="17" font-weight="800" fill="#172033" text-anchor="start">Ground the Topic &amp; Story Intent / 題材と物語意図を根拠付け</text><text x="144" y="290" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">News: sources → facts; free input: user-provided, not news</text><text x="144" y="308" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">ニュース: 出典→事実。自由入力: ユーザー提供。結末方針・舞台・衣装も選定</text><path d="M 397 321 L 397 338" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="339" width="654" height="83" rx="18" fill="#ffffff" stroke="#2475b9" stroke-width="2.5"/><rect x="70" y="339" width="56" height="83" rx="18" fill="#2475b9"/><rect x="108" y="339" width="18" height="83" fill="#2475b9"/></g><circle cx="98" cy="367" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="373" font-size="15" font-weight="800" fill="#2475b9" text-anchor="middle">3</text><text x="144" y="368" font-size="17" font-weight="800" fill="#172033" text-anchor="start">Turn Character Logic into Four Beats / キャラ論理を4コマへ反映</text><text x="144" y="392" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">Traits, relations and speech shape roles, reactions, dialogue and emotional cause/effect</text><text x="144" y="410" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">性格・関係・話し方が役割・リアクション・台詞・感情の因果を決める</text><path d="M 397 423 L 397 440" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="441" width="654" height="83" rx="18" fill="#ffffff" stroke="#2475b9" stroke-width="2.5"/><rect x="70" y="441" width="56" height="83" rx="18" fill="#2475b9"/><rect x="108" y="441" width="18" height="83" fill="#2475b9"/></g><circle cx="98" cy="469" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="475" font-size="15" font-weight="800" fill="#2475b9" text-anchor="middle">4</text><text x="144" y="470" font-size="17" font-weight="800" fill="#172033" text-anchor="start">Stage Character-Specific Acting / キャラ固有の演技を演出</text><text x="144" y="494" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">Action decides gaze, phase, weight, hand roles and prop contact; pose is not personality</text><text x="144" y="512" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">動作から視線・段階・重心・手・小道具接触を決定。参照ポーズを性格と誤認しない</text><path d="M 397 525 L 397 542" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><path d="M 397 543 L 537 594 L 397 645 L 257 594 Z" fill="#ffffff" stroke="#bf4c5c" stroke-width="2.5"/></g><text x="397" y="587" font-size="12" font-weight="800" fill="#bf4c5c" text-anchor="middle">Scenario Contract Pass?</text><text x="397" y="604" font-size="9" font-weight="400" fill="#42506a" text-anchor="middle">事実・4コマ・安全・台詞・キャラ契約を満たすか？</text>
<text x="248" y="588" font-size="8.5" font-weight="800" fill="#a73949" text-anchor="end">No: repair explicitly / 不合格: 指定修正</text><text x="248" y="601" font-size="8.5" font-weight="400" fill="#a73949" text-anchor="end">Re-validate, up to 3 / 再検証、最大3回</text><text x="546" y="594" font-size="10" font-weight="800" fill="#1f7b67" text-anchor="start">Yes / 合格</text><path d="M 397 646 L 397 663" fill="none" stroke="#219679" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="664" width="654" height="83" rx="18" fill="#ffffff" stroke="#8653b8" stroke-width="2.5"/><rect x="70" y="664" width="56" height="83" rx="18" fill="#8653b8"/><rect x="108" y="664" width="18" height="83" fill="#8653b8"/></g><circle cx="98" cy="692" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="698" font-size="15" font-weight="800" fill="#8653b8" text-anchor="middle">5</text><text x="144" y="693" font-size="17" font-weight="800" fill="#172033" text-anchor="start">Build the Rendering Contract / 描画契約を組み立てる</text><text x="144" y="717" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">Script + cast + style/colour + camera; bubbles read right → left independently</text><text x="144" y="735" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">台本・キャスト・画風/色・画角を統合。吹き出しは話者位置と独立して右→左へ配置</text><path d="M 397 748 L 397 765" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="766" width="654" height="75" rx="18" fill="#ffffff" stroke="#8653b8" stroke-width="2.5"/><rect x="70" y="766" width="56" height="75" rx="18" fill="#8653b8"/><rect x="108" y="766" width="18" height="75" fill="#8653b8"/></g><circle cx="98" cy="794" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="800" font-size="15" font-weight="800" fill="#8653b8" text-anchor="middle">6</text><text x="144" y="795" font-size="17" font-weight="800" fill="#172033" text-anchor="start">Generate with References / 参照付きで生成</text><text x="144" y="819" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">Selected provider/model + character/background/360° references</text><text x="144" y="837" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">選択プロバイダー・モデル + 人物/背景/360°参照で生成</text><path d="M 397 842 L 397 859" fill="none" stroke="#52617a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><path d="M 397 860 L 537 911 L 397 962 L 257 911 Z" fill="#ffffff" stroke="#bf4c5c" stroke-width="2.5"/></g><text x="397" y="904" font-size="12" font-weight="800" fill="#bf4c5c" text-anchor="middle">API Policy Error?</text><text x="397" y="921" font-size="9" font-weight="400" fill="#42506a" text-anchor="middle">コンテンツポリシー拒否か？</text>
<text x="248" y="905" font-size="8.25" font-weight="800" fill="#a73949" text-anchor="end">Yes: adjust expression → regenerate / はい: 表現調整 → 再生成</text><text x="248" y="918" font-size="8.25" font-weight="400" fill="#a73949" text-anchor="end">Maximum 5; retain successes / 最大5回、成功画像は保持</text><text x="546" y="911" font-size="10" font-weight="800" fill="#1f7b67" text-anchor="start">No / いいえ</text><path d="M 397 963 L 397 980" fill="none" stroke="#219679" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-navy)"/>
<g filter="url(#shadow)"><rect x="70" y="981" width="654" height="75" rx="18" fill="#ffffff" stroke="#219679" stroke-width="2.5"/><rect x="70" y="981" width="56" height="75" rx="18" fill="#219679"/><rect x="108" y="981" width="18" height="75" fill="#219679"/></g><circle cx="98" cy="1009" r="17" fill="#ffffff" fill-opacity=".96"/><text x="98" y="1015" font-size="15" font-weight="800" fill="#219679" text-anchor="middle">7</text><text x="144" y="1010" font-size="17" font-weight="800" fill="#172033" text-anchor="start">Review, Compare, Keep / 検査・比較・保持</text><text x="144" y="1034" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">Check identity, anatomy, props, text, order, gaze, camera, light and depth</text><text x="144" y="1052" font-size="12.5" font-weight="400" fill="#42506a" text-anchor="start">同一性・人体・小物・文字・読順・視線・画角・照明・奥行きを検査し最良結果を保持</text>
<text x="397" y="1087" font-size="11" font-weight="800" fill="#245d50" text-anchor="middle">A warning does not erase an existing result. / 警告が出ても既存の成功画像や履歴を消さない。</text><text x="397" y="1110" font-size="9" font-weight="400" fill="#66738a" text-anchor="middle">Source: scripts/generate_workflow_diagram.mjs | npm run docs:workflow-diagram / 図の正本</text>
</svg>
